<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>具身智能名词表 · 交互式镜像版</title>
<meta name="description" content="具身智能和机器人领域 2900+ 专有名词的交互式名词表：分类卡片、学习路径、命令面板搜索，中英双语。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231D5C6B'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E具%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">
    <svg width="24" height="24" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#1D5C6B"/><text x="16" y="22" font-size="16" text-anchor="middle" fill="#fff" font-family="sans-serif">具</text></svg>
    <span>具身智能名词表</span>
  </a>
  <button class="search-trigger" id="searchTrigger" aria-label="搜索">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5.2"/><path d="M11 11l3.6 3.6" stroke-linecap="round"/></svg>
    <span>搜中文、英文或缩写…</span>
    <kbd>Ctrl K</kbd>
  </button>
  <span class="spacer"></span>
  <div class="seg" id="tierSeg" role="group" aria-label="分级">
    <button data-tier="1" class="on">入门必知</button>
    <button data-tier="2">入门+常用</button>
    <button data-tier="3">全部</button>
  </div>
  <button class="iconbtn" id="randomBtn" title="随机一个词">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8h.01M16 8h.01M8 16h.01M16 16h.01M12 12h.01"/></svg>
  </button>
  <button class="iconbtn" id="langBtn" title="语言切换"><span id="langLabel">EN</span></button>
  <button class="iconbtn" id="themeBtn" title="深浅色切换">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<div class="wrap" id="app">
  <!-- 由 app.js 渲染 -->
</div>

<footer class="site-footer">
  <p class="sync-state" id="syncState"></p>
  <p>内容经 <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.zh-hans" target="_blank" rel="noopener">CC BY-NC 4.0</a> 许可，源自 <a href="https://embodiedterms.com/" target="_blank" rel="noopener">embodiedterms.com</a> · 数据可通过 <code>sync.py</code> 自动同步更新</p>
  <p><a href="#/about">关于</a></p>
</footer>

<!-- 词条详情抽屉 -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <button class="iconbtn seen-toggle" id="seenToggle">标记为已学</button>
    <span class="spacer"></span>
    <button class="iconbtn" id="drawerPrev" title="上一个">‹</button>
    <button class="iconbtn" id="drawerNext" title="下一个">›</button>
  </div>
</aside>

<!-- 命令面板 -->
<div class="palette" id="palette">
  <div class="scrim"></div>
  <div class="palette-box">
    <div class="palette-input">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5.2"/><path d="M11 11l3.6 3.6" stroke-linecap="round"/></svg>
      <input id="paletteInput" type="text" placeholder="搜索词条，如 VLA、逆运动学、宇树…" autocomplete="off">
    </div>
    <div class="palette-results" id="paletteResults"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>Enter</kbd> 打开</span>
      <span><kbd>Esc</kbd> 关闭</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data/zh.js" defer></script>
<script src="data/en.js" defer></script>
<script src="assets/app.js" defer></script>
</body>
</html>
