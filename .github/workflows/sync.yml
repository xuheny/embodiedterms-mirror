name: sync-upstream

# 每天 UTC 01:17（北京时间 09:17）自动同步原站数据；也可在 Actions 页面手动触发
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync data from upstream
        run: python3 sync.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "上游无更新，无需提交"
          else
            git commit -m "chore: 同步上游最新数据"
            git push
            echo "已同步并推送，GitHub Pages 将自动更新"
          fi
